name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Core + Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w @memory/web
      - run: npm test
      - run: npm run web:build

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Inject app config (repository variables API_URL, GOOGLE_WEB_CLIENT_ID; both public values)
        env:
          API_URL: ${{ vars.API_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          node -e "require('fs').writeFileSync('apps/mobile/src/config.json', JSON.stringify({ apiUrl: process.env.API_URL || '', googleWebClientId: process.env.GOOGLE_WEB_CLIENT_ID || '' }, null, 2))"
      - name: Prepare release signing key (falls back to the debug key if the secret is not set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/memory-release.jks"
            echo "MEMORY_KEYSTORE_FILE=$RUNNER_TEMP/memory-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - APK is signed with the public debug key"
          fi
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          MEMORY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEMORY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEMORY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}
      - name: Name the APK and show its signing certificate
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk memory-game.apk
          "$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner" verify --print-certs memory-game.apk | grep -E "SHA-256|certificate DN" | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: memory-game-android-apk
          path: memory-game.apk

  release:
    name: Publish GitHub Release
    needs: [web, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memory-game-android-apk
      - name: Create release with a stable asset name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" memory-game.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Memory Game 1.0.${{ github.run_number }}" \
            --notes "Android APK. Always-latest link: https://github.com/${{ github.repository }}/releases/latest/download/memory-game.apk" \
            --latest
