name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  web:
    name: Core + Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w @memory/web
      - run: npm test
      - run: npm run web:build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build release APK (signed with the debug key; replace with your own keystore for Play Store)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: memory-game-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
